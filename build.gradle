// MinecraftForge 26.2 port of Jade.
// The original NeoForge build (net.neoforged.moddev) is kept as build.gradle.neoforge.bak.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = "mc${archive_minecraft_version}-Forge-${mod_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

minecraft {
    // Jade already ships a Forge-format access transformer next to its NeoForge class tweaker.
    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        register('client') {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-65.1.0")

    // Forge ships MixinExtras but does not put it on the compile classpath.
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.4'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

sourceSets.main.java {
    // Neither recipe-viewer has a Forge 26.2 build. Both compat classes are looked up by name at
    // runtime (JadeClient.addRecipeLookupPlugin("snownee.jade.compat.REICompat")), so leaving them
    // out of the build simply means the lookup never resolves — no other code references them.
    exclude 'snownee/jade/compat/REICompat.java'
    exclude 'snownee/jade/compat/JEICompat.java'
    // The test package cannot be excluded from compilation: Jade.java imports ExamplePlugin
    // unconditionally. It is still kept out of the jar by the `jar` task below.
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.mod_version

    filesMatching('META-INF/mods.toml') {
        expand(['version': project.mod_version])
    }

    // NeoForge-only metadata: its class tweaker is replaced by the access transformer, and its
    // mods.toml by the Forge one.
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'jade.classtweaker'

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    exclude '/snownee/jade/test'
    exclude '/me/shedaniel/rei' // me.shedaniel.rei (placeholder)

    from rootDir.toPath().resolve('LICENSE.md').toFile()

    manifest.attributes 'MixinConfigs': 'jade.mixins.json'

    destinationDirectory = file(layout.buildDirectory).toPath().resolve('mods').toFile()
}
